name: eval
on:
  push:
  pull_request:
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard library only: retrieval hit rate and refusal gate must pass
      # on every push, with no API keys in CI.
      - run: python eval.py
